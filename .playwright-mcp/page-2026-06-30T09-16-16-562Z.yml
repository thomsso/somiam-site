      - generic [ref=f6e253]:
        - generic [ref=f6e255]: "01"
        - generic [ref=f6e256]: Diagnostic gratuit
        - paragraph [ref=f6e257]: On évalue vos avis, détecte les faiblesses en communication et identifie les opportunités manquées. Si on peut vous aider, on démarre. Si on peut pas, on vous le dit.
