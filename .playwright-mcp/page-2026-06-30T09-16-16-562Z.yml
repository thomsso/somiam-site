        - generic [ref=f6e265]: "03"
        - generic [ref=f6e266]: Accompagnement So MIAM
        - paragraph [ref=f6e267]: On gère vos réseaux sociaux, votre fiche Google et vos publicités Meta. Vous recevez un rapport de performance mensuel. Pendant que vous cuisinez.
